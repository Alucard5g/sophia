# Configuración de despliegue directo con Google Cloud Build y Cloud Run
# Ejecutar con: gcloud builds submit --config=cloudbuild.yaml
steps:
  # 1. Construcción de la imagen del contenedor con Dockerfile de producción
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sophia-app:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sophia-app:$COMMIT_SHA'
      - '.'

  # 2. Publicación de la imagen en Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sophia-app:latest'

  # 3. Despliegue automatizado en Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'sophia-app'
      - '--image=gcr.io/$PROJECT_ID/sophia-app:latest'
      - '--region=us-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/sophia-app:latest'
  - 'gcr.io/$PROJECT_ID/sophia-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
