name: CI/CD Pipeline - Build, Test & Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: sophia-app
  REGION: us-east1
  GAR_LOCATION: us-east1
  REPOSITORY: sophia-docker-repo

jobs:
  validate-and-test:
    name: Lint & Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck & Lint
        run: npm run lint

      - name: Verify Full Production Build
        run: npm run build
        env:
          NODE_ENV: production

  deploy-cloud-run:
    name: Build Container & Deploy to Cloud Run
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Google Cloud Auth (Workload Identity Provider o Clave de Cuenta de Servicio)
        if: env.PROJECT_ID != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        if: env.PROJECT_ID != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Container Registry / Artifact Registry
        if: env.PROJECT_ID != ''
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        if: env.PROJECT_ID != ''
        run: |
          IMAGE_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy to Cloud Run
        if: env.PROJECT_ID != ''
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--port=3000 --memory=1Gi --cpu=1 --allow-unauthenticated'
          env_vars: |
            NODE_ENV=production
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
